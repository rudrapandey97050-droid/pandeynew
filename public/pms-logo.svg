<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#000000" />
      <stop offset="100%" stop-color="#111116" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Badge (Black Circular Logo like EvoStore) -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Border Ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />

  <!-- Center Artwork: Minimalist Premium Smartphone Silhouette with Apple/Tech Aesthetic -->
  <g transform="translate(196, 75)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="120" height="200" rx="26" ry="26" fill="none" stroke="url(#silverGrad)" stroke-width="9" />
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="42" y="14" width="36" height="8" rx="4" ry="4" fill="url(#silverGrad)" />
    <!-- Inner Screen Glow Accent -->
    <circle cx="60" cy="100" r="32" fill="url(#goldAccent)" opacity="0.25" filter="url(#glow)" />
    <!-- Apple / Lightning Glyph inside screen -->
    <path d="M57 68 L66 68 L53 102 L63 102 L51 134 L68 96 L58 96 Z" fill="url(#silverGrad)" />
    <!-- Home Bar Indicator -->
    <line x1="42" y1="184" x2="78" y2="184" stroke="url(#silverGrad)" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Brand Typography: PMS -->
  <text x="256" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Outfit', 'Helvetica Neue', sans-serif" font-size="82" font-weight="900" letter-spacing="6" fill="#ffffff">
    PMS
  </text>

  <!-- Subtitle: PANDEY MOBILE -->
  <text x="256" y="396" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" letter-spacing="7" fill="url(#silverGrad)">
    PANDEY MOBILE
  </text>

  <!-- Location Badge: BUTWAL -->
  <text x="256" y="432" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="700" letter-spacing="5" fill="#38bdf8">
    BUTWAL • NEPAL
  </text>
</svg>
